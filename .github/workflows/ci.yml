name: Kiểm tra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kiểm tra kiểu, chạy kiểm thử, đóng gói thử (không triển khai, không cần khóa).
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: "false"
